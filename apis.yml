name: Bailey44
description: >-
  Bailey 44 (stylized Bailey/44) is a contemporary womenswear brand selling
  direct-to-consumer through a Shopify storefront at bailey44.com. The label
  offers women's apparel — dresses, tops, knits, and separates — around a brand
  voice of optimism and self-expression ("The Future is Female"). Bailey44 was
  surfaced in the API Evangelist network as a portfolio company of Norwest
  Venture Partners. It does not publish a public developer API; its only
  machine-readable surfaces are the Shopify Customer Account API discovery
  documents (OpenID Connect / OAuth 2.0 authorization-server metadata, issuer
  shopify.com/authentication/8596750398) served at bailey44.com/.well-known/,
  a standard Shopify sitemap, and an RSS-backed news blog. This profile is a
  lead enriched by the pipeline; no first-party API artifacts were found.
